version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: yape-db
    restart: always
    environment:
      POSTGRES_USER: sonouser
      POSTGRES_PASSWORD: sonopay2025
      POSTGRES_DB: yape_transporte
    volumes:
      - yape_final_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonouser -d yape_transporte"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: yape-backend
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://sonouser:sonopay2025@db:5432/yape_transporte?schema=public"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  yape_final_volume:
