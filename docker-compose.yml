version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: yape_transporte
      MYSQL_ROOT_PASSWORD: password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: "mysql://root:password@db:3306/yape_transporte"
      JWT_SECRET: "your_super_secret_key"
      PORT: 3000
    depends_on:
      - db

volumes:
  mysql_data:
